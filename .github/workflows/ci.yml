name: quality

on:
  push:
    branches: [main, feat/alive-runtime, feat/rwa-intelligence-pivot]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Workspace tests
        run: pnpm test

      - name: Contract tests (explicit release gate)
        run: pnpm test:contracts

      - name: Production build
        run: pnpm build

      - name: Legacy physical-state integration regression
        run: pnpm smoke:local
