[profile.default]
src = "contracts"
test = "test/foundry"
out = "out"
libs = ["node_modules"]
cache_path = "cache_forge"
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true

remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"
]
